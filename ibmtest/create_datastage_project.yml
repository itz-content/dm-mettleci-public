---
- name: Create jenkins_devops project and import project assets
  hosts: localhost
  become: true

  vars:
    # --- DataStage Environment Variables ---
    mci_install_dir: "/opt/dm/mci"
    ds_engine_dir: "/opt/IBM/InformationServer/Server/DSEngine"
    is_domain: "10.10.10.201:59445"
    is_server: "server-1"
    is_user: "isadmin"
    is_password: "9BaAMKZjzmTiDcJtRb"

  tasks:
    - name: Create DataStage Project (Jenkins_Devops)
      ansible.builtin.shell: |
        . ./dsenv
        bin/dsadmin -domain {{ is_domain }} -server {{ is_server }} -user {{ is_user }} -password {{ is_password }} -createproject Jenkins_Devops
      args:
        chdir: "{{ ds_engine_dir }}"
      register: create_proj_result
      # Idempotency check: Don't fail if the project already exists
      failed_when:
        - create_proj_result.rc != 0
        - "'already exists' not in create_proj_result.stdout and 'already exists' not in create_proj_result.stderr"
      changed_when: create_proj_result.rc == 0
      no_log: true  # Added to prevent logging the cleartext password

    - name: Ensure the DataStage project data directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: dsadm
        group: dstage
        mode: '0755'
      loop:
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/dataset
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/file
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/report
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/testdata

    - name: Extract TestData files to testdata folder (flattened)
      # Extracts ONLY the contents of the TestData directory, dropping Mac hidden files
      command: >
        unzip -o -j /home/itzuser/SourceData.zip
        "SourceData/TestData/*"
        -x "*__MACOSX*" "*.DS_Store"
        -d /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/testdata

    - name: Extract main SourceData files to data folder (excluding TestData)
      # Extracts the main directory but excludes TestData and Mac hidden files
      command: >
        unzip -o -j /home/itzuser/SourceData.zip
        "SourceData/*"
        -x "SourceData/TestData/*" "*__MACOSX*" "*.DS_Store"
        -d /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/file

    - name: Ensure correct ownership on all extracted DataStage data files
      ansible.builtin.file:
        path: "{{ item }}"
        owner: dsadm
        group: dstage
        recurse: true
      loop:
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/dataset
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/file
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/report
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/testdata

    - name: Copy specific staging files to standardized target names
      ansible.builtin.copy:
        src: "/opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/file/{{ item.src }}"
        dest: "/opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data/electromart/file/{{ item.dest }}"
        remote_src: true
        owner: dsadm
        group: dstage
        mode: '0664'
      loop:
        - { src: 'StgCustomer_20K.csv', dest: 'StgCustomer.csv' }
        - { src: 'StgProduct_50.csv', dest: 'StgProduct.csv' }
        - { src: 'StgSupplier_5.csv', dest: 'StgSupplier.csv' }
        - { src: 'StgFinance_20240901-20240930_2K.csv', dest: 'StgFinance.csv' }
        - { src: 'StgSales_20240901-20240930_2K.csv', dest: 'StgSales.csv' }

    - name: Install MettleCI custom menu items silently
      ansible.windows.win_package:
        path: C:\is_temp\MCI_Setup.exe
        arguments: 
          - /S
        state: present

    - name: Discover the single DataStage Client UUID
      ansible.windows.win_shell: |
        (Get-ChildItem -Path "HKCU:\Software\IBM\InformationServer\DataStage Client" | Where-Object { $_.PSChildName -match "^[0-9a-fA-F]{8}-" }).PSChildName
      register: ds_uuids
      changed_when: false

    - name: Patch MettleCI custom menu URLs in the Registry
      ansible.windows.win_regedit:
        path: 'HKCU:\Software\IBM\InformationServer\DataStage Client\{{ ds_uuids.stdout_lines[0] }}\DataStage Client\Tools\{{ item.key }}'
        name: Arguments
        data: 'http://10.10.10.201:58081{{ item.path }}'
        type: string
      loop:
        - { key: 'Menu#0', path: '/projects/%ProjectName/test-cases/%JobName' }
        - { key: 'Menu#1', path: '/projects/%ProjectName/commits/create?assets=%JobName' }
        - { key: 'Menu#2', path: '/projects/%ProjectName/compliance/create?asset=%JobName' }
        