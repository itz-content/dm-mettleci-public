---
- name: Create jenkins_devops project and import project assets
  hosts: localhost
  become: true

  vars:
    # --- DataStage Environment Variables ---
    mci_install_dir: "/opt/dm/mci"
    ds_engine_dir: "/opt/IBM/InformationServer/Server/DSEngine"
    is_domain: "10.10.10.201:59445"
    is_server: "server-1"
    is_user: "isadmin"
    is_password: "9BaAMKZjzmTiDcJtRb"

  tasks:
    - name: Create DataStage Project (Jenkins_Devops)
      ansible.builtin.shell: |
        . ./dsenv
        bin/dsadmin -domain {{ is_domain }} -server {{ is_server }} -user {{ is_user }} -password {{ is_password }} -createproject Jenkins_Devops
      args:
        chdir: "{{ ds_engine_dir }}"
      register: create_proj_result
      # Idempotency check: Don't fail if the project already exists
      failed_when:
        - create_proj_result.rc != 0
        - "'already exists' not in create_proj_result.stdout and 'already exists' not in create_proj_result.stderr"
      changed_when: create_proj_result.rc == 0
      no_log: true  # Added to prevent logging the cleartext password

    - name: Ensure the DataStage project data directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data
        - /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/testdata

    - name: Extract TestData files to testdata folder (flattened)
      # Extracts ONLY the contents of the TestData directory, dropping Mac hidden files
      command: >
        unzip -o -j /home/itzuser/SourceData.zip
        "SourceData/TestData/*"
        -x "*__MACOSX*" "*.DS_Store"
        -d /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/testdata

    - name: Extract main SourceData files to data folder (excluding TestData)
      # Extracts the main directory but excludes TestData and Mac hidden files
      command: >
        unzip -o -j /home/itzuser/SourceData.zip
        "SourceData/*"
        -x "SourceData/TestData/*" "*__MACOSX*" "*.DS_Store"
        -d /opt/IBM/InformationServer/Server/Projects/Jenkins_Devops/data
