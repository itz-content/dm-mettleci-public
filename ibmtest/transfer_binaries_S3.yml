---
- name: Transfer and Extract IBM 11.7.1.6 and Db2 Binaries from S3
  hosts: localhost
  become: true
  gather_facts: true

  vars:
    s3_bucket_name: "dm-mettleci-public"
    aws_endpoint_url: "https://s3.us.cloud-object-storage.appdomain.cloud"

    remote_staging_path: "/opt/IBM/InformationServer"
    dm_software: "binaries/dm_software"

    main_tar: "IS_V11716_Linux_x86_multi.tar.gz"
    spec_zip: "IS_V11716.bundle_spec_file_mult.zip"
    db2_tar: "v11.5.8_linuxx64_server_dec.tar.gz"
    gitea_bin: "gitea-1.27.0-linux-amd64"
    gitea_act: "gitea-runner-3.3.2-linux-amd64"
    jenkins_rpm: "jenkins-2.462.3-1.1.noarch.rpm"
    rsa3072: "CommKey" # Update version if needed

  tasks:
    - name: 1. Check if AWS CLI is installed
      shell: command -v aws
      register: aws_cli_check
      ignore_errors: true
      changed_when: false

    - name: 2. Install AWS CLI on RHEL9 if missing
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q awscliv2.zip
        ./aws/install --update
        rm -rf awscliv2.zip ./aws
      args:
        chdir: /tmp
      when: aws_cli_check.rc != 0

    - name: 3. Ensure Clean Staging Directory Exists on Root Volume
      file:
        path: "{{ remote_staging_path }}"
        state: directory
        owner: root
        group: dstage
        mode: '0777'

    - name: 4. Copy Main Tarball using AWS CLI
      shell: >
        AWS_ACCESS_KEY_ID="{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ aws_secret_access_key }}"
        /usr/local/bin/aws s3 cp s3://{{ s3_bucket_name }}/binaries/{{ main_tar }} {{ remote_staging_path }}/{{ main_tar }}
        --endpoint-url {{ aws_endpoint_url }}
      no_log: true

    - name: 4.1. Copy Db2 Tarball using AWS CLI
      shell: >
        AWS_ACCESS_KEY_ID="{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ aws_secret_access_key }}"
        /usr/local/bin/aws s3 cp s3://{{ s3_bucket_name }}/binaries/{{ db2_tar }} {{ remote_staging_path }}/{{ db2_tar }}
        --endpoint-url {{ aws_endpoint_url }}
      no_log: true

    - name: 5. Copy Bundle Spec Zip using AWS CLI
      shell: >
        AWS_ACCESS_KEY_ID="{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ aws_secret_access_key }}"
        /usr/local/bin/aws s3 cp s3://{{ s3_bucket_name }}/binaries/{{ spec_zip }} {{ remote_staging_path }}/{{ spec_zip }}
        --endpoint-url {{ aws_endpoint_url }}
      no_log: true

    - name: 6. Ensure Home Directory Exists for itzuser
      file:
        path: "/home/itzuser"
        state: directory
        owner: itzuser
        group: itzuser
        mode: '0755'

    - name: 7. Copy Software RPMs to itzuser Home using AWS CLI
      shell: >
        AWS_ACCESS_KEY_ID="{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ aws_secret_access_key }}"
        /usr/local/bin/aws s3 cp s3://{{ s3_bucket_name }}/{{ dm_software }}/ /home/itzuser/
        --recursive
        --endpoint-url {{ aws_endpoint_url }}
      no_log: true

    - name: 8. Copy Gitea binary to itzuser Home using AWS CLI
      shell: >
        AWS_ACCESS_KEY_ID="{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ aws_secret_access_key }}"
        /usr/local/bin/aws s3 cp s3://{{ s3_bucket_name }}/binaries/{{ gitea_bin }} /home/itzuser/{{ gitea_bin }}
        --endpoint-url {{ aws_endpoint_url }}
      no_log: true

    - name: 8.1. Copy Gitea Runner binary to itzuser Home using AWS CLI
      shell: >
        AWS_ACCESS_KEY_ID="{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ aws_secret_access_key }}"
        /usr/local/bin/aws s3 cp s3://{{ s3_bucket_name }}/binaries/{{ gitea_act }} /home/itzuser/{{ gitea_act }}
        --endpoint-url {{ aws_endpoint_url }}
      no_log: true

    - name: 8.2. Make Gitea and act_runner binaries executable
      file:
        path: "/home/itzuser/{{ item }}"
        mode: '0755'
        owner: itzuser
        group: itzuser
      loop:
        - "{{ gitea_bin }}"
        - "{{ gitea_act }}"

    - name: 9. Copy Jenkins RPM to itzuser Home using AWS CLI
      shell: >
        AWS_ACCESS_KEY_ID="{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ aws_secret_access_key }}"
        /usr/local/bin/aws s3 cp s3://{{ s3_bucket_name }}/binaries/{{ jenkins_rpm }} /home/itzuser/jenkins-local.rpm
        --endpoint-url {{ aws_endpoint_url }}
      no_log: true

    - name: 10. Set itzuser Ownership on Copied RPMs and Binaries
      file:
        path: "/home/itzuser"
        owner: itzuser
        group: itzuser
        recurse: true

    - name: 11. Extract Main Tarball via Native Shell
      ansible.builtin.shell: "tar -xzf {{ main_tar }}"
      args:
        chdir: "{{ remote_staging_path }}"

    - name: 12. Extract Db2 Tarball into Isolated Folder
      ansible.builtin.shell: |
        mkdir -p db2_extracted
        tar -xzf {{ db2_tar }} -C db2_extracted
      args:
        chdir: "{{ remote_staging_path }}"

    - name: 13. Ensure Target Directory for Bundle Spec Exists
      file:
        path: "{{ remote_staging_path }}/is-suite"
        state: directory
        owner: root
        group: dstage
        mode: '0777'

    - name: 14. Extract Bundle Spec Zip via Native Shell
      ansible.builtin.shell: "unzip -q {{ spec_zip }} -d is-suite"
      args:
        chdir: "{{ remote_staging_path }}"

    - name: 15. Force Clean Recursive Ownership & Permissions for Installer
      file:
        path: "{{ remote_staging_path }}/is-suite"
        owner: root
        group: dstage
        mode: '0777'
        recurse: true

    - name: 16. Verify Critical Extraction Files are Present
      stat:
        path: "{{ remote_staging_path }}/is-suite/{{ item }}"
      loop:
        - setup
        - image.properties
      register: file_check

    - name: 17. Ensure .ssh directory exists for itzuser
      file:
        path: /home/itzuser/.ssh
        state: directory
        owner: itzuser
        group: itzuser
        mode: '0700'
    
    - name: 17.1. Copy SSH Key
      shell: >
        AWS_ACCESS_KEY_ID="{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY="{{ aws_secret_access_key }}"
        /usr/local/bin/aws s3 cp s3://{{ s3_bucket_name }}/ssh/{{ rsa3072 }} /home/itzuser/.ssh/{{ rsa3072 }}
        --endpoint-url {{ aws_endpoint_url }}
      no_log: true

    - name: 18. Ensure correct permissions and ownership for SSH private key
      file:
        path: /home/itzuser/.ssh/{{ rsa3072 }}
        owner: itzuser
        group: itzuser
        mode: '0600'
        state: file

    - name: 19. Cleanup Downloaded Archives to Conserve Space
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ remote_staging_path }}/{{ main_tar }}"
        - "{{ remote_staging_path }}/{{ spec_zip }}"
        - "{{ remote_staging_path }}/{{ db2_tar }}"
