---
- name: Install and Configure MettleCI Workbench on RHEL9
  hosts: localhost
  become: yes # Requires root privileges

  vars:
    # Source directory populated by transfer_binaries.yml
    source_dir: "/home/itzuser"
    
    # We only hardcode the license since its name doesn't change with versions
    license_file: "mettleci.lic"
    
    # Default installation directory for MettleCI Workbench
    mci_install_dir: "/opt/dm/mci"

    # --- Gitea API Configuration ---
    gitea_api_url: "http://10.10.10.201:53000/api/v1/user/keys"
    gitea_user: "itzuser"
    gitea_password: "giteapwd"

  tasks:
    - name: 1. Find the MettleCI Workbench RPM dynamically
      ansible.builtin.find:
        paths: "{{ source_dir }}"
        patterns: "dm-mettleci-workbench-*.rpm"
      register: found_rpm

    - name: 1.1. Safety Check - Ensure exactly one RPM was found
      ansible.builtin.fail:
        msg: "Expected exactly 1 MettleCI RPM in {{ source_dir }}, but found {{ found_rpm.matched }}."
      when: found_rpm.matched != 1

    - name: 2. Ensure the Linux JVM directory exists
      ansible.builtin.file:
        path: /usr/lib/jvm
        state: directory
        mode: '0755'

    - name: 2.1 Find the downloaded OpenJDK tarball
      ansible.builtin.shell: "ls /home/itzuser/OpenJDK*.tar.gz | head -n 1"
      register: downloaded_java_tar
      changed_when: false

    - name: 2.2 Extract the Java tarball
      ansible.builtin.unarchive:
        src: "{{ downloaded_java_tar.stdout }}"
        dest: "/usr/lib/jvm"
        remote_src: true

    - name: 2.3 Find the exact name of the extracted Java folder
      ansible.builtin.shell: "ls -d /usr/lib/jvm/jdk-11* | head -n 1"
      register: java_extracted_path
      changed_when: false

    - name: 2.4 Register Java 11 in the alternatives system
      ansible.builtin.command: >
        alternatives --install /usr/bin/java java "{{ java_extracted_path.stdout }}/bin/java" 10000

    - name: 2.5 Set Java 11 as the system default
      ansible.builtin.command: >
        alternatives --set java "{{ java_extracted_path.stdout }}/bin/java"

    - name: 3. Install MettleCI Workbench via local RPM
      ansible.builtin.dnf:
        name: "{{ found_rpm.files[0].path }}"
        state: present
        disable_gpg_check: yes # Standard for custom third-party RPMs

    - name: 4. Ensure Installation Directory Exists
      ansible.builtin.file:
        path: "{{ mci_install_dir }}"
        state: directory
        owner: mciworkb
        group: dstage
        mode: '0755'

    - name: 5. Deploy setupENV.sh script from repository
      ansible.builtin.copy:
        src: setupEnv.sh
        dest: "{{ mci_install_dir }}/setupEnv.sh"
        owner: mciworkb
        group: dstage
        mode: '0755'  

    - name: 5.1 Deploy License File from itzuser home directory
      ansible.builtin.copy:
        src: "{{ source_dir }}/{{ license_file }}"
        dest: "{{ mci_install_dir }}/mettleci.lic"
        remote_src: yes # Tells Ansible the file is already on the RHEL9 target
        owner: mciworkb
        group: dstage
        mode: '0644'
      notify: restart mettleci

    - name: 5.2 Copy and rename config.yml natively (Force Overwrite)
      ansible.builtin.command:
        cmd: "cp -f {{ source_dir }}/config.yml.cpy {{ mci_install_dir }}/config.yml"

    - name: 5.2.1 Set ownership and permissions on config.yml
      ansible.builtin.file:
        path: "{{ mci_install_dir }}/config.yml"
        owner: mciworkb
        group: dstage
        mode: '0600'
      notify: restart mettleci

    - name: 5.3 Generate 4096-bit RSA key pair (workbench.key)
      ansible.builtin.command:
        cmd: ssh-keygen -t rsa -b 4096 -f {{ mci_install_dir }}/workbench.key -q -N ""
        # The 'creates' flag makes this idempotent: it will NOT overwrite the key if it already exists
        creates: "{{ mci_install_dir }}/workbench.key"

    - name: 5.4 Ensure proper ownership and permissions for the private key
      ansible.builtin.file:
        path: "{{ mci_install_dir }}/workbench.key"
        owner: mciworkb
        group: dstage
        mode: '0600' # Owner-only read/write

    - name: 5.5 Ensure proper ownership and permissions for the public key
      ansible.builtin.file:
        path: "{{ mci_install_dir }}/workbench.key.pub"
        owner: mciworkb
        group: dstage
        mode: '0644' # Owner read/write, everyone else read-only
    
    - name: 5.6 Find the MettleCI UI jar file dynamically
      ansible.builtin.find:
        paths: "{{ mci_install_dir }}"
        patterns: "mettle-ui-*.jar"
      register: found_mettle_jar

    - name: 5.7 Safety Check - Ensure exactly one MettleCI UI jar was found
      ansible.builtin.fail:
        msg: "Expected exactly 1 mettle-ui jar in {{ mci_install_dir }}, but found {{ found_mettle_jar.matched }}."
      when: found_mettle_jar.matched != 1

    - name: 5.8 Trust DataStage Services Tier certificate
      ansible.builtin.command:
        cmd: "java -jar {{ found_mettle_jar.files[0].path }} trust-datastage config.yml"
        chdir: "{{ mci_install_dir }}"
      notify: restart mettleci
 
    - name: 5.9 Read the generated public key from disk
      ansible.builtin.slurp:
        src: "{{ mci_install_dir }}/workbench.key.pub"
      register: public_key_content

    - name: 5.10 Add the SSH public key to Gitea user profile via REST API
      ansible.builtin.uri:
        url: "{{ gitea_api_url }}"
        method: POST
        url_username: "{{ gitea_user }}"
        url_password: "{{ gitea_password }}"
        force_basic_auth: yes
        body_format: json
        body:
          title: "MettleCI Workbench Key"
          key: "{{ public_key_content['content'] | b64decode | trim }}"
        status_code: [201, 422]

    - name: 6. Ensure MettleCI Service is Started (Legacy Init)
      ansible.builtin.shell: service dm-mettleci-workbench start
      register: service_status
      changed_when: service_status.rc == 0
      failed_when: 
        - service_status.rc != 0
        - "'already running' not in service_status.stdout" # Prevents failure if it's already on

    - name: 7. Find the MettleCI Unit Test Harness RPM dynamically
      ansible.builtin.find:
        paths: "{{ source_dir }}"
        patterns: "dm-unittest-harness-*.rpm"
      register: found_unittest_rpm

    - name: 7.1. Safety Check - Ensure exactly one Unit Test RPM was found
      ansible.builtin.fail:
        msg: "Expected exactly 1 Unit Test RPM in {{ source_dir }}, but found {{ found_unittest_rpm.matched }}."
      when: found_unittest_rpm.matched != 1

    - name: 8. Install MettleCI Unit Test Harness via local RPM
      ansible.builtin.dnf:
        name: "{{ found_unittest_rpm.files[0].path }}"
        state: present
        disable_gpg_check: yes
  
    - name: 9. Find the MettleCI Command Shell RPM dynamically
      ansible.builtin.find:
        paths: "{{ source_dir }}"
        patterns: "dm-mettleci-command-shell-*.rpm"
      register: found_cli_rpm

    - name: 9.1. Safety Check - Ensure exactly one CLI RPM was found
      ansible.builtin.fail:
        msg: "Expected exactly 1 Command Shell RPM in {{ source_dir }}, but found {{ found_cli_rpm.matched }}."
      when: found_cli_rpm.matched != 1

    - name: 10. Install MettleCI Command Shell via local RPM
      ansible.builtin.dnf:
        name: "{{ found_cli_rpm.files[0].path }}"
        state: present
        disable_gpg_check: yes

  handlers:
    - name: restart mettleci
      ansible.builtin.shell: |
        service dm-mettleci-workbench stop
        sleep 2
        service dm-mettleci-workbench start