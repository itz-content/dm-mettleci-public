---
- name: Setup IIS Local Git Repositories
  hosts: localhost
  become: no  
  
  vars:
    # Use absolute paths to avoid issues with ~ in shell commands
    source_dir: "/home/itzuser"
    base_dir: "/home/itzuser/LocalRepos"
    git_email: "itzuser@example.com"
    git_user: "itzuser"
    gitea_password: "giteapwd"
    gitea_host: "10.10.10.201" # RHEL 9 IP
    gitea_port: "53000"
    gitea_url: "http://{{ gitea_host }}:{{ gitea_port }}"

  tasks:
    - name: 1. Find the Compliance Rules zip dynamically
      ansible.builtin.find:
        paths: "{{ source_dir }}"
        patterns: "dm-compliance-rules-*.zip"
      register: found_compliance

    - name: 1.1. Safety Check - Ensure exactly one Compliance zip was found
      ansible.builtin.fail:
        msg: "Expected exactly 1 compliance zip, but found {{ found_compliance.matched }}."
      when: found_compliance.matched != 1

    - name: 2. Find the Repo Template zip dynamically
      ansible.builtin.find:
        paths: "{{ source_dir }}"
        patterns: "mettleci-repo-template-*.zip"
      register: found_template

    - name: 2.1. Safety Check - Ensure exactly one Repo Template zip was found
      ansible.builtin.fail:
        msg: "Expected exactly 1 repo template zip, but found {{ found_template.matched }}."
      when: found_template.matched != 1

    - name: 3. Dynamically define the repositories list
      ansible.builtin.set_fact:
        repos:
          - name: compliance
            zip: "{{ found_compliance.files[0].path }}"
            copy_path: "*/."  
          - name: electromart
            zip: "{{ found_template.files[0].path }}"
            copy_path: "mettleci-repo-template/."
          - name: jenkins-mci-shared-libraries
            zip: "{{ found_template.files[0].path }}"
            copy_path: "jenkins-mci-shared-libraries/."

    - name: 4. Ensure target repository directories exist
      ansible.builtin.file:
        path: "{{ base_dir }}/{{ item.name }}"
        state: directory
        mode: '0755'
      loop: "{{ repos }}"

    - name: 5. Ensure temporary staging directories exist
      ansible.builtin.file:
        path: "/tmp/{{ item.name }}_staging"
        state: directory
      loop: "{{ repos }}"

    - name: 6. Extract zip archives to temporary staging directories
      ansible.builtin.unarchive:
        src: "{{ item.zip }}"
        dest: "/tmp/{{ item.name }}_staging"
        remote_src: yes
      loop: "{{ repos }}"

    - name: 7. Copy exact nested contents to target repositories
      ansible.builtin.shell: |
        cp -a /tmp/{{ item.name }}_staging/{{ item.copy_path }} "{{ base_dir }}/{{ item.name }}/"
      loop: "{{ repos }}"

    - name: 8. Clean up temporary staging directories
      ansible.builtin.file:
        path: "/tmp/{{ item.name }}_staging"
        state: absent
      loop: "{{ repos }}"

    - name: 9. Initialize Git, configure, and commit extracted files
      ansible.builtin.shell: |
        # 1. Strip out any hidden .git folders that were extracted from the zip file
        find . -type d -name ".git" -exec rm -rf {} +
        
        # 2. Proceed with the standard initialization
        git init
        git config --local user.email "{{ git_email }}"
        git config --local user.name "{{ git_user }}"
        git add .
        git commit -m "Initial commit: Extracted base files for {{ item.name }}" || true
      args:
        chdir: "{{ base_dir }}/{{ item.name }}" 
      loop: "{{ repos }}"

    - name: 10. Create empty repositories in Gitea via REST API
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/user/repos"
        method: POST
        url_username: "{{ git_user }}"
        url_password: "{{ gitea_password }}"
        force_basic_auth: yes
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "MettleCI {{ item.name }} repository"
          private: true
        status_code: [201, 409] 
      loop: "{{ repos }}"

    - name: 11. Push local repositories to Gitea
      ansible.builtin.shell: |
        git remote remove origin || true
        git remote add origin "http://{{ git_user }}:{{ gitea_password }}@{{ gitea_host }}:{{ gitea_port }}/{{ git_user }}/{{ item.name }}.git"
        git branch -M main
        git push -u origin main
      args:
        chdir: "{{ base_dir }}/{{ item.name }}"
      loop: "{{ repos }}"