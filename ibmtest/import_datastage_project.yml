---
- name: Execute istools ISX import on Windows Techzone target
  hosts: windows_target
  gather_facts: false

  vars:
    # Connection variables
    ansible_connection: ssh
    ansible_shell_type: cmd
    ansible_user: itzuser
    ansible_ssh_private_key_file: /home/itzuser/.ssh/CommKey
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    # istools import variables
    is_domain: "10.10.10.201:59445"
    is_user: "isadmin"
    is_password: "9BaAMKZjzmTiDcJtRb"
    isx_file_path: 'C:\is_temp\jenkins_devops_techzone.isx'
    istools_cli_dir: 'C:\IBM\InformationServer\Clients\istools\cli'
    is_asbnode_bin: 'C:\IBM\InformationServer\ASBNode\bin'
    is_datastage_path: "server-1/Jenkins_Devops"

  tasks:

    - name: Trust the Information Server SSL Certificate
      ansible.windows.win_shell: |
        .\UpdateSignerCerts.bat -url "https://{{ is_domain }}" -user "{{ is_user }}" -password "{{ is_password }}" -silent
      args:
        chdir: "{{ is_asbnode_bin }}"

    - name: Run istool import and redirect output to log
      ansible.windows.win_shell: >
        .\istool.bat import
        -domain "{{ is_domain }}"
        -username "{{ is_user }}"
        -password "{{ is_password }}"
        -archive "{{ isx_file_path }}"
        -datastage "{{ is_datastage_path }}"
        -replace > C:\is_temp\istool_background.log 2>&1
      args:
        chdir: "{{ istools_cli_dir }}"
      no_log: false

    - name: Read the log file to capture the results
      ansible.windows.win_shell: Get-Content C:\is_temp\istool_background.log
      register: log_output

    - name: Display the import results
      debug:
        var: log_output.stdout_lines

    - name: Install MettleCI custom menu items silently
      ansible.windows.win_package:
        path: C:\is_temp\MCI_Setup.exe
        arguments:
          - /S
        state: present

    - name: Discover the single DataStage Client UUID
      ansible.windows.win_shell: |
        (Get-ChildItem -Path "HKCU:\Software\IBM\InformationServer\DataStage Client" | Where-Object { $_.PSChildName -match "^[0-9a-fA-F]{8}-" }).PSChildName
      register: ds_uuids
      changed_when: false

    - name: Patch MettleCI custom menu URLs in the Registry
      ansible.windows.win_regedit:
        path: 'HKCU:\Software\IBM\InformationServer\DataStage Client\{{ ds_uuids.stdout_lines[0] }}\DataStage Client\Tools\{{ item.key }}'
        name: Arguments
        data: 'http://10.10.10.201:58081{{ item.path }}'
        type: string
      loop:
        - { key: 'Menu#0', path: '/projects/%ProjectName/test-cases/%JobName' }
        - { key: 'Menu#1', path: '/projects/%ProjectName/commits/create?assets=%JobName' }
        - { key: 'Menu#2', path: '/projects/%ProjectName/compliance/create?asset=%JobName' }

