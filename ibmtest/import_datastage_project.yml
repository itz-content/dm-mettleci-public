---
- name: Create jenkins_devops project and import project assets
  hosts: localhost 
  become: yes

  vars:
# --- DataStage Environment Variables ---
    ds_engine_dir: "/opt/IBM/InformationServer/Server/DSEngine"
    is_domain: "10.10.10.201:54995"
    is_user: "isadmin"
    is_password: "9BaAMKZjzmTiDcJtRb"
    dsx_file_path: "/home/itzuser/jenkins_devops.dsx"

  tasks:
    - name: Create DataStage Project (Jenkins_Devops)
      ansible.builtin.shell: |
        . ./dsenv
        bin/dsadmin -create Jenkins_Devops
      args:
        chdir: "{{ ds_engine_dir }}"
      register: create_proj_result
      # Idempotency check: Don't fail if the project already exists
      failed_when: 
        - create_proj_result.rc != 0
        - "'already exists' not in create_proj_result.stdout and 'Project exists' not in create_proj_result.stderr"
      changed_when: "'already exists' not in create_proj_result.stdout and 'Project exists' not in create_proj_result.stderr"

    - name: Import jenkins_devops.dsx into the project
      ansible.builtin.shell: |
        . ./dsenv
        bin/dscmdimport /d={{ is_domain }} /h={{ inventory_hostname }} /u={{ is_user }} /p={{ is_password }} Jenkins_Devops {{ dsx_file_path }}
      args:
        chdir: "{{ ds_engine_dir }}"
      register: dsx_import_result
      changed_when: dsx_import_result.rc == 0
      # Using no_log prevents the IS password from printing in your Ansible logs
      no_log: true 