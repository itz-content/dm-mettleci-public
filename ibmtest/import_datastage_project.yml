---
- name: Create jenkins_devops project and import project assets
  hosts: localhost 
  become: yes

  vars:
    # --- DataStage Environment Variables ---
    mci_install_dir: "/opt/dm/mci"
    ds_engine_dir: "/opt/IBM/InformationServer/Server/DSEngine"
    is_domain: "10.10.10.201:59445"
    is_server: "server-1"
    is_user: "isadmin"
    is_password: "9BaAMKZjzmTiDcJtRb" 
    isx_file_path: "/home/itzuser/jenkins_devops.isx" # <--- Your new ISX file

  tasks:
    - name: Create DataStage Project (Jenkins_Devops)
      ansible.builtin.shell: |
        . ./dsenv
        bin/dsadmin -domain {{ is_domain }} -server {{ is_server }} -user {{ is_user }} -password {{ is_password }} -createproject Jenkins_Devops
      args:
        chdir: "{{ ds_engine_dir }}"
      register: create_proj_result
      # Idempotency check: Don't fail if the project already exists
      failed_when: 
        - create_proj_result.rc != 0
        - "'already exists' not in create_proj_result.stdout and 'already exists' not in create_proj_result.stderr"
      changed_when: create_proj_result.rc == 0
      no_log: true  # Added to prevent logging the cleartext password

    - name: Create a dedicated directory for the ISX import
      ansible.builtin.file:
        path: "/home/itzuser/isx_import_temp"
        state: directory
        mode: '0755'

    - name: Move the ISX file into the dedicated directory
      ansible.builtin.command:
        cmd: "mv /home/itzuser/jenkins_devops.isx /home/itzuser/isx_import_temp/jenkins_devops.isx"
        removes: "/home/itzuser/jenkins_devops.isx"

    - name: Ensure MettleCI log directory exists
      ansible.builtin.file:
        path: "/opt/dm/mci/log"
        state: directory
        owner: itzuser
        mode: '0755'
    
    - name: Import jenkins_devops.isx into the project natively via MettleCI CLI
      ansible.builtin.shell: |
        ./mettleci isx import -domain {{ is_domain }} -server {{ is_server }} -username {{ is_user }} -password '{{ is_password }}' -project Jenkins_Devops -location /home/itzuser/isx_import_temp
      args:
        chdir: "{{ mci_install_dir }}/cli"
      register: mci_import_result
      changed_when: mci_import_result.rc == 0
      no_log: false
    