---
- name: Install and Configure PostgreSQL on RHEL9 for DataStage
  hosts: all  # Update this to match your RHEL9 target group
  become: yes # Requires root privileges

  vars:
    # Database configuration variables
    datastage_db_name: "datastage_projects"
    datastage_db_user: "ds_admin"
    datastage_db_password: "ChangeMe123!" # Update this to a secure password

  tasks:
    - name: 1. Install PostgreSQL server and Python psycopg2 dependency
      ansible.builtin.dnf:
        name:
          - postgresql-server
          - python3-psycopg2 # Required for Ansible's postgresql modules
        state: present

    - name: 2. Check if PostgreSQL database is already initialized
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: pg_init_check

    - name: 3. Initialize PostgreSQL database
      ansible.builtin.command: postgresql-setup --initdb
      when: not pg_init_check.stat.exists

    - name: 4. Ensure PostgreSQL service is started and enabled on boot
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes

    - name: 5. Create the DataStage database
      community.postgresql.postgresql_db:
        name: "{{ datastage_db_name }}"
      become_user: postgres

    - name: 6. Create the DataStage database user and grant privileges
      community.postgresql.postgresql_user:
        db: "{{ datastage_db_name }}"
        name: "{{ datastage_db_user }}"
        password: "{{ datastage_db_password }}"
        priv: "ALL"
        state: present
      become_user: postgres

    - name: 7. Configure pg_hba.conf to allow IPv4 local password authentication
      ansible.builtin.replace:
        path: /var/lib/pgsql/data/pg_hba.conf
        regexp: '^(host\s+all\s+all\s+127\.0\.0\.1/32\s+)ident'
        replace: '\1scram-sha-256'
      notify: restart postgresql

    - name: 8. Configure pg_hba.conf to allow IPv6 local password authentication
      ansible.builtin.replace:
        path: /var/lib/pgsql/data/pg_hba.conf
        regexp: '^(host\s+all\s+all\s+::1/128\s+)ident'
        replace: '\1scram-sha-256'
      notify: restart postgresql

  handlers:
    - name: restart postgresql
      ansible.builtin.service:
        name: postgresql
        state: restarted