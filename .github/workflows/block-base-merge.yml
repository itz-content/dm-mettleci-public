name: Block Base Branch Merge
on:
  pull_request:
    branches:
      - main

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Source Branch
        if: github.head_ref == 'base_11_7_1_6'
        run: |
          echo "ERROR: Merging your-base-branch-name into main is strictly forbidden."
          exit 1
